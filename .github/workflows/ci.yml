name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff linter
        run: ruff check src/ tests/

      - name: Run ruff formatter check
        run: ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        fastmcp-version: ["2.13.0", "latest"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Install specific fastmcp version
        if: matrix.fastmcp-version != 'latest'
        run: pip install "fastmcp==${{ matrix.fastmcp-version }}"

      - name: Install latest fastmcp
        if: matrix.fastmcp-version == 'latest'
        run: pip install --upgrade fastmcp

      - name: Show installed fastmcp version
        run: pip show fastmcp | grep Version

      - name: Run tests
        run: pytest tests/ -v --tb=short

  server-startup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fastmcp-version: ["2.13.0", "latest"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install specific fastmcp version
        if: matrix.fastmcp-version != 'latest'
        run: pip install "fastmcp==${{ matrix.fastmcp-version }}"

      - name: Install latest fastmcp
        if: matrix.fastmcp-version == 'latest'
        run: pip install --upgrade fastmcp

      - name: Show installed fastmcp version
        run: pip show fastmcp | grep Version

      - name: Verify server module imports successfully
        run: python -c "from revenium_mcp_server.enhanced_server import create_enhanced_server; print('Server module imports OK')"

      - name: Verify server can be instantiated
        run: python -c "from revenium_mcp_server.enhanced_server import create_enhanced_server; server = create_enhanced_server(); print(f'Server instantiated: {server.name}')"
