[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenium-mcp"
version = "0.7.0"
description = "Model Context Protocol (MCP) server for Revenium API monitoring, analytics, and AI spending management"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Revenium Team", email = "support@revenium.io"}
]
maintainers = [
    {name = "Revenium Team", email = "support@revenium.io"}
]
keywords = ["mcp", "revenium", "api", "ai", "assistant", "cli", "server", "model-context-protocol", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
    "Environment :: Console",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    # Exact pin: Docker images resolve dependencies at build time, so this
    # must match uv.lock (the version CI tests). fastmcp 3.4.3 turned the
    # streamable-HTTP Host/Origin guard on by default, which rejected every
    # hosted request with 421 unless FASTMCP_HTTP_ALLOWED_HOSTS was set;
    # 3.4.4 reverted that default for the 3.x line and 4.x keeps it off —
    # `http_host_origin_protection` in fastmcp.settings.Settings defaults to
    # false — so hosted traffic is accepted and the allowlist stays opt-in
    # hardening. From 3.3.0 the code ships in the fastmcp-slim distribution
    # and `fastmcp` is a meta-package over it (still true on 4.x) — see the
    # pip recovery note in the CI workflow. 4.x depends on mcp 2.x, so the
    # server speaks the 2026-07-28 protocol revision; fastmcp negotiates the
    # best mutual era per connection, so legacy clients keep working.
    "fastmcp==4.0.0",
    "httpx>=0.25.0",
    # Floor tracks the pinned fastmcp: fastmcp-slim 4.x requires pydantic
    # >=2.12, and the MCP SDK v2 snake_case field bridge needs it.
    "pydantic>=2.12.0",
    "loguru>=0.7.0",
    "structlog>=23.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "matplotlib>=3.7.0",
    # numpy 2.5 stubs use Python 3.12-only syntax, while mypy checks this
    # project as Python 3.11. Keep the lint baseline deterministic until the
    # project raises its mypy target.
    "numpy>=1.24.0,<2.5.0",
    "aiofiles>=23.0.0",
    "diskcache>=5.6.0",
    "cachetools>=5.3.0",
    "redis>=5.0",
    # Direct dependency: auth/client_storage.py imports key_value.aio for the
    # OAuth proxy's shared Redis store. Floor 0.4.5: earlier RedisStore drops
    # the rediss:// scheme (no TLS), which hangs every storage call against
    # the TLS-required ElastiCache. Ceiling matches the pinned fastmcp's pin.
    "py-key-value-aio>=0.4.5,<0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.10.0",
    "pytest-httpserver>=1.0.0",
    "PyJWT[crypto]>=2.8.0",
    "fakeredis>=2.20",
    "ruff>=0.4.0",
    # mypy is pinned to a single minor series so the regression-gate baseline
    # (scripts/mypy-baseline.txt) stays deterministic across environments.
    # mypy 1.20 changed the no-untyped-def message ("arguments" -> "parameters")
    # vs 1.19, and mypy 2.x changes it further; either would invalidate the
    # checked-in baseline. Bump this pin in the same PR that regenerates the
    # baseline so local and CI keep agreeing.
    "mypy>=1.20.0,<1.21.0",
    "types-aiofiles",
    "types-psutil",
    "pre-commit>=3.0.0",
    "psutil>=5.9.0",
    # Generates src/revenium_mcp_server/generated/ from the committed OpenAPI
    # snapshots via scripts/generate_openapi_models.py (BACK-2868). DEV ONLY:
    # the generated models are read by tests, never imported by a runtime
    # module, so this must not leak into [project] dependencies.
    "datamodel-code-generator>=0.25",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.10.0",
    "pytest-httpserver>=1.0.0",
    "PyJWT[crypto]>=2.8.0",
    "requests-mock>=1.10.0",
    "fakeredis>=2.20",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/revenium/revenium-mcp"
Documentation = "https://github.com/revenium/revenium-mcp#readme"
Repository = "https://github.com/revenium/revenium-mcp"
"Bug Tracker" = "https://github.com/revenium/revenium-mcp/issues"

[project.scripts]
revenium-mcp = "revenium_mcp_server.enhanced_server:main_sync"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# datamodel-codegen output is machine-written from the OpenAPI snapshots and is
# regenerated wholesale by scripts/generate_openapi_models.py, so nobody can fix
# a type error in it by hand. It emits Pydantic constrained-type calls
# (conint(ge=0)) that mypy rejects as annotations, which would add hundreds of
# entries to scripts/mypy-baseline.txt and re-churn it on every regeneration —
# the baseline would stop being a record of debt worth paying down. Nothing
# under this package is imported by a runtime module (see
# src/revenium_mcp_server/generated/README.md), so excluding it costs no
# coverage of shipped code. Ruff deliberately still checks it: its findings
# (undefined names, unused imports) would be real breakage, and today it passes.
exclude = ["^src/revenium_mcp_server/generated/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["h2", "dateutil", "dateutil.parser", "diskcache", "fastmcp", "fastmcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cachetools"]
ignore_missing_imports = true

# Belt and braces for the exclude above: `exclude` only applies while mypy walks
# a directory, so a future caller that names a generated file directly (or
# imports it from a checked module) would still surface its errors.
[[tool.mypy.overrides]]
module = ["revenium_mcp_server.generated.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["revenium_mcp_server.monitoring.metrics"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "revenium_mcp_server.health_endpoints",
    "revenium_mcp_server.tool_configuration.registry",
]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running",
    "timeout: per-test timeout in seconds (enforced when pytest-timeout is installed)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    # Machine-generated OpenAPI models (BACK-2868). Thousands of statements no
    # runtime module imports, so they would be counted as uncovered and drag the
    # --cov-fail-under gate down without saying anything about the coverage of
    # shipped logic. See src/revenium_mcp_server/generated/README.md.
    "*/revenium_mcp_server/generated/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict parameter
    # Pre-existing technical debt in this codebase — suppressed to allow incremental
    # cleanup rather than blocking CI on inherited violations.
    "B904",   # raise without from inside except (consistent pattern throughout repo)
    "B025",   # duplicate try-block exception (pre-existing)
    "B007",   # unused loop control variable (pre-existing)
    "B023",   # function uses loop variable (pre-existing)
    "B011",   # assert False (pre-existing)
    "C401",   # unnecessary generator-set (pre-existing)
    "C408",   # unnecessary collection call (pre-existing)
    "C414",   # unnecessary double cast (pre-existing)
    "E402",   # module import not at top (pre-existing; conditional imports used)
    "E712",   # true-false comparison (pre-existing)
    "E721",   # type comparison (pre-existing)
    "F403",   # import star (pre-existing)
    "F405",   # undefined from star import (pre-existing)
    "F601",   # multi-value repeated key (pre-existing)
    "F821",   # undefined name (pre-existing; includes forward references)
    "F841",   # unused variable (pre-existing)
    "W291",   # trailing whitespace (pre-existing)
    "W293",   # blank line with whitespace (pre-existing)
    "B017",   # assert blind exception (pre-existing in tests; exception type often not exported)
    "E731",   # lambda assignment (pre-existing in tests; used for simple test helpers)
    "E741",   # ambiguous variable name (pre-existing in tests; l/I/O used in list comps)
]
# Note: I (isort) and UP (pyupgrade) rules disabled temporarily
# Re-enable after codebase cleanup

[tool.ruff.lint.isort]
known-first-party = ["revenium_mcp_server"]
