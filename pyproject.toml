[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenium-mcp"
version = "0.2.7"
description = "Model Context Protocol (MCP) server for Revenium API monitoring, analytics, and AI spending management"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Revenium Team", email = "support@revenium.io"}
]
maintainers = [
    {name = "Revenium Team", email = "support@revenium.io"}
]
keywords = ["mcp", "revenium", "api", "ai", "assistant", "cli", "server", "model-context-protocol", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
    "Environment :: Console",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0,<4.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "structlog>=23.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "revenium-middleware-openai>=0.4.6",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "aiofiles>=23.0.0",
    "diskcache>=5.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "psutil>=5.9.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.10.0",
    "requests-mock>=1.10.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/revenium/revenium-mcp"
Documentation = "https://github.com/revenium/revenium-mcp#readme"
Repository = "https://github.com/revenium/revenium-mcp"
"Bug Tracker" = "https://github.com/revenium/revenium-mcp/issues"

[project.scripts]
revenium-mcp = "revenium_mcp_server.enhanced_server:main_sync"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict parameter
    # Pre-existing technical debt in this codebase — suppressed to allow incremental
    # cleanup rather than blocking CI on inherited violations.
    "B904",   # raise without from inside except (consistent pattern throughout repo)
    "B025",   # duplicate try-block exception (pre-existing)
    "B007",   # unused loop control variable (pre-existing)
    "B023",   # function uses loop variable (pre-existing)
    "B011",   # assert False (pre-existing)
    "C401",   # unnecessary generator-set (pre-existing)
    "C408",   # unnecessary collection call (pre-existing)
    "C414",   # unnecessary double cast (pre-existing)
    "E402",   # module import not at top (pre-existing; conditional imports used)
    "E712",   # true-false comparison (pre-existing)
    "E721",   # type comparison (pre-existing)
    "F403",   # import star (pre-existing)
    "F405",   # undefined from star import (pre-existing)
    "F601",   # multi-value repeated key (pre-existing)
    "F821",   # undefined name (pre-existing; includes forward references)
    "F841",   # unused variable (pre-existing)
    "W291",   # trailing whitespace (pre-existing)
    "W293",   # blank line with whitespace (pre-existing)
    "B017",   # assert blind exception (pre-existing in tests; exception type often not exported)
    "E731",   # lambda assignment (pre-existing in tests; used for simple test helpers)
    "E741",   # ambiguous variable name (pre-existing in tests; l/I/O used in list comps)
]
# Note: I (isort) and UP (pyupgrade) rules disabled temporarily
# Re-enable after codebase cleanup

[tool.ruff.lint.isort]
known-first-party = ["revenium_mcp_server"]
